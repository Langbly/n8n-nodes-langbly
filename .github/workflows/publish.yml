name: Publish to npm

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Required for npm provenance
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
      # --ignore-scripts skips native postinstall builds (isolated-vm, pulled
      # in transitively by n8n-workflow, needs node >=22 to compile natively
      # and fails on the runner's node 20 toolchain). The build only needs
      # tsc + the n8n-workflow type defs, so the native binary is irrelevant
      # here. Matches the working GitLab CI config (.gitlab-ci.yml).
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npm publish --provenance --access public --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
