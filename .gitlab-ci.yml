# Publishes the package to npm with provenance on a version tag.
# Provenance is generated from GitLab CI via Sigstore OIDC (the SIGSTORE_ID_TOKEN
# id_token below), which npm accepts the same way it accepts GitHub Actions
# provenance. NPM_TOKEN is a masked CI/CD variable (granular token, write access
# to n8n-nodes-langbly, bypass 2FA).
stages:
  - publish

publish:
  stage: publish
  image: node:20
  id_tokens:
    SIGSTORE_ID_TOKEN:
      aud: sigstore
  rules:
    - if: $CI_COMMIT_TAG
  script:
    # --ignore-scripts skips native postinstall builds (e.g. isolated-vm pulled
    # in transitively by n8n-workflow, which needs node >=22 to compile). The
    # build only needs tsc + the n8n-workflow type defs, so the native binary is
    # irrelevant here.
    - echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > .npmrc
    - npm install --ignore-scripts
    - npm run build
    - npm publish --provenance --access public --ignore-scripts
